<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider & Video Editor</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/gifshot@0.3.2/dist/gifshot.min.js"></script>
</head>

<body class="dark">

<header>
  <h1>🎬 Image Slider & Video Editor</h1>
</header>

<main>

  <section class="upload">
    <input type="file" id="fileInput" multiple accept="image/*">
  </section>

  <section id="slider" class="slider"></section>

  <section class="controls">
    <button id="prev">◀</button>
    <button id="next">▶</button>

    <button id="undo">Undo</button>
    <button id="redo">Redo</button>

    <select id="animation">
      <option value="fade">Fade</option>
      <option value="slide">Slide</option>
      <option value="zoom">Zoom</option>
    </select>

    <button id="exportGif">Export GIF</button>
    <button id="exportWebm">Export WEBM</button>
    <button id="exportMp4">Export MP4</button>

    <input type="file" id="musicInput" accept="audio/*">
  </section>

  <section class="timeline">
    <h3>Timeline (Drag to reorder)</h3>
    <div id="timeline"></div>
  </section>

  <section class="text-editor">
    <h3>Text Overlay</h3>
    <input id="textInput" placeholder="Slide text">
    <select id="textPosition">
      <option value="bottom">Bottom</option>
      <option value="center">Center</option>
      <option value="top">Top</option>
    </select>
  </section>

  <section class="theme">
    <h3>Theme</h3>
    <select id="themeSelect">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="neon">Neon</option>
    </select>
  </section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
